name: ci

# Build the Racket WASM IDE and run its tests on every push to main (and on
# PRs). The build is heavy (emsdk + a host threaded Chez + a host Racket), but
# the orchestrator's content-addressed .work/ cache makes any push that does NOT
# change the delta (patches/overlay/wasm-deps/pin/pkgs) a clone-free, emsdk-free
# assemble in seconds. We persist that cache (see the `actions/cache` step) so
# only the first run and delta/pin/pkg changes pay the ~30-45 min cold build.
#
# Deploy: on a green push to main, the `deploy` job publishes the `dist`
# artifact to Netlify (gated behind build + browser-tests). Needs
# NETLIFY_AUTH_TOKEN + NETLIFY_SITE_ID repo secrets.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Run the JS-based actions on Node 24 (Node 20 is deprecated and removed from
# runners 2026-09; forced default 2026-06-16). The official opt-in; covers every
# action uniformly, including the third-party setup-emsdk.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# One in-flight run per ref; newer pushes cancel older ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Host Racket runs the orchestrator (build/main.rkt) and serve.rkt. A WARM
      # (cache-hit) assemble -- the common case -- is happy with `stable`. A COLD
      # full build additionally needs a host Racket whose VERSION matches the
      # pinned upstream commit (upstream.lock) so the cross-server xpatch loads;
      # if a delta/pin bump makes the cold build fail resolving that xpatch, pin
      # `version:` here to a matching snapshot (or supply --racket). See
      # build-wasm.md "CI".
      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: 'stable'

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # Provides emcc/emconfigure for the cold path (the emcc link). The action
      # caches the emsdk install itself; harmless on warm runs (no link happens).
      # Pinned to 5.0.7 (matching the locally-verified-working dev toolchain):
      # 'latest' silently drifted to 6.0.2 during an 11-day CI gap and broke the
      # racket-web.js PROXY_TO_PTHREAD proxied-main worker spawn (shell-worker.js's
      # mainScriptUrlOrBlob fix no longer takes effect on 6.0.2), which races/
      # aborts the racket-web.data preload fetch and hangs boot at "Preparing (1)"
      # forever -- see the browser-tests failures on 2026-07-02. Re-verify against
      # a newer emsdk deliberately (bump this pin + a manual workflow_dispatch)
      # rather than free-floating on 'latest' again.
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: '5.0.7'

      # Persist the three content-addressed runtime cache layers -- NOT the clone
      # (.work/racket is huge, mutated, and re-synced on demand). The key mirrors
      # the orchestrator's build-key inputs (delta + pkgs/local-pkgs), so any
      # delta/pin/pkg change busts it -> full rebuild; otherwise a hit -> fast
      # assemble. No restore-keys: content-addressed, so a partial restore is
      # useless.
      - name: Restore runtime cache
        id: rtcache
        uses: actions/cache@v5
        with:
          path: |
            .work/runtime-cache
            .work/sdk-cache
            .work/app-payload-cache
          key: racket-wasm-cache-${{ runner.os }}-${{ hashFiles('upstream.lock', 'patches/**', 'overlay/**', 'wasm-deps/**', 'runtime-glue/*.js', 'runtime-glue/serve.rkt', 'apps/ide/app.rkt', 'packages/web-repl/**') }}

      # --- host toolchain (only matters on a COLD orchestrator build) ----------
      # A cold build needs a NATIVE THREADED host Chez (--scheme) + a host Racket
      # whose version matches the pin (--racket, for the cross-server xpatch).
      # Neither exists on a stock runner, and the orchestrator can't bootstrap
      # Chez (sync's `clean -ffdx` strips boot/pb and the pin vendors ChezScheme
      # as a tree WITHOUT boot/). So build BOTH from racket/racket at the pin:
      # provision the pb boot files (racket/src/configure needs ChezScheme/boot/pb
      # for its CS-only bootstrap -- there is no BC fallback in Chez 10.x), then
      # `make` builds a threaded host Chez + a version-matched host racket in one
      # tree. Cached on the pin SHA (rarely changes); a warm orchestrator cache
      # makes all of this moot (the assemble is toolchain-free).
      - name: Resolve upstream pin
        id: pin
        run: echo "sha=$(grep -oE '[0-9a-f]{40}' upstream.lock | head -1)" >> "$GITHUB_OUTPUT"

      # restore-only here; we SAVE explicitly after a successful Locate so a
      # failed/partial build never poisons the cache (the v2 key abandons any
      # poisoned entry from earlier attempts).
      - name: Restore host toolchain (Chez + Racket at the pin)
        id: hosttc
        uses: actions/cache/restore@v5
        with:
          path: host-toolchain
          key: host-toolchain-v3-${{ runner.os }}-${{ steps.pin.outputs.sha }}

      # Build only when we'll actually cold-build (orchestrator cache missed) AND
      # we don't already have the toolchain cached.
      - name: Build host toolchain
        if: steps.rtcache.outputs.cache-hit != 'true' && steps.hosttc.outputs.cache-hit != 'true'
        env:
          PLT_SETUP_OPTIONS: --no-docs   # skip core-doc render (irrelevant to a cross-server)
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/racket/racket.git host-toolchain
          git -C host-toolchain checkout --detach "${{ steps.pin.outputs.sha }}"
          chez="$GITHUB_WORKSPACE/host-toolchain/racket/src/ChezScheme"

          # Provision the pb boot files matching the vendored ChezScheme version.
          # scheme-version #x0a050001 -> 10.5.0.1; racket/pb keeps per-version
          # branches `v<a>.<b>.<c>-pre-release.<d>-<rev>` carrying petite/scheme.boot.
          hex=$(grep -oE 'scheme-version #x[0-9a-fA-F]+' "$chez/s/cmacros.ss" | grep -oE '[0-9a-fA-F]{8}$')
          a=$((16#${hex:0:2})); b=$((16#${hex:2:2})); c=$((16#${hex:4:2})); d=$((16#${hex:6:2}))
          if [ "$d" -ne 0 ]; then base="v${a}.${b}.${c}-pre-release.${d}"; else base="v${a}.${b}.${c}"; fi
          branch=$(git ls-remote --heads https://github.com/racket/pb.git \
                     | sed 's#.*refs/heads/##' | grep -E "^${base}-[0-9]+$" | sort -V | tail -1)
          [ -n "$branch" ] || { echo "no racket/pb branch for ChezScheme $a.$b.$c.$d (base $base)"; exit 1; }
          echo "pb boot branch: $branch"
          git clone --depth 1 --branch "$branch" https://github.com/racket/pb.git "$chez/boot/pb"
          rm -rf "$chez/boot/pb/.git"

          # Host racket (--racket): in-tree CS build, bootstrapped from boot/pb.
          ( cd "$GITHUB_WORKSPACE/host-toolchain/racket/src" && ./configure && make -j"$(nproc)" && make install )

          # Standalone THREADED host Chez (--scheme). The racket build above only
          # leaves the pb (portable-bytecode) bootstrap scheme; the orchestrator
          # needs a native threaded scheme (t<arch>), so build one from the same
          # boot/pb-provisioned ChezScheme source.
          ( cd "$chez" && ./configure --threads --disable-x11 && make -j"$(nproc)" )

          rm -rf "$GITHUB_WORKSPACE/host-toolchain/.git" # slim the cache

      # Locate the binaries from the toolchain (freshly built OR cache-restored)
      # and expose them to the build step. Skipped silently if absent (warm
      # orchestrator build needs no host toolchain).
      - name: Locate host toolchain
        run: |
          set -uo pipefail
          root="$GITHUB_WORKSPACE/host-toolchain"
          [ -d "$root" ] || { echo "no host toolchain (warm build)"; exit 0; }
          # In-tree build lands under racket/src/cs/c/ (NOT build/cs/c/). Find the
          # threaded (t<arch>) standalone scheme, excluding the xc- cross workarea,
          # and the racket exe -- search broadly so layout shifts don't break us.
          scheme="$(find "$root" -type f -path '*/bin/*/scheme' 2>/dev/null | grep -E '/t[a-z0-9]+/bin/t[a-z0-9]+/scheme$' | grep -v '/xc-' | head -1)"
          racket="$(find "$root" -type f -path '*/bin/racket' 2>/dev/null | head -1)"
          if [ -x "$scheme" ] && [ -x "$racket" ]; then
            echo "HOST_SCHEME=$scheme" >> "$GITHUB_ENV"
            echo "HOST_RACKET=$racket" >> "$GITHUB_ENV"
            echo "host Chez:   $scheme"
            echo "host Racket: $racket"
          elif [ "${{ steps.rtcache.outputs.cache-hit }}" != "true" ]; then
            echo "cold build but host toolchain binaries not found: scheme='$scheme' racket='$racket'" >&2
            echo "--- scheme candidates ---"; find "$root" -type f -name scheme 2>/dev/null | head -20
            echo "--- racket candidates ---"; find "$root" -type f -name racket 2>/dev/null | head -20
            exit 1
          else
            echo "host toolchain binaries not found, but orchestrator cache is warm -- not needed"
          fi

      # Save the toolchain cache only after a verified-good build (Locate set
      # HOST_SCHEME and didn't fail). Skipped on a restore hit. This is what keeps
      # a failed/partial build from poisoning the cache.
      - name: Save host toolchain cache
        if: steps.hosttc.outputs.cache-hit != 'true' && env.HOST_SCHEME != ''
        uses: actions/cache/save@v5
        with:
          path: host-toolchain
          key: host-toolchain-v3-${{ runner.os }}-${{ steps.pin.outputs.sha }}

      # Host tools the orchestrator's native wasm-deps build shells out to
      # (glib/pango/cairo/... cross-built via emconfigure): meson drives ninja;
      # cmake + pkg-config + gperf are used by individual deps. cmake/pkg-config
      # ship on ubuntu-latest; meson/ninja/gperf do not. Cheap, so unconditional.
      - name: Install native-deps build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build cmake pkg-config gperf

      # Build the IDE (the default app). Warm = clone-free assemble (no toolchain
      # flags needed); cold = full build using the host Chez/Racket above.
      - name: Build IDE
        run: |
          args=()
          if [ -n "${HOST_SCHEME:-}" ]; then
            args+=(--scheme "$HOST_SCHEME" --racket "$HOST_RACKET")
          fi
          racket build/main.rkt build "${args[@]}"

      # End-to-end cairo/png/freetype FFI smoke against the node base runtime.
      # Runs + asserts on a COLD build (clone present, FFI linkage could have
      # changed); skips cleanly on a warm build (runtime byte-identical to a
      # prior green run).
      - name: FFI draw-stack test
        run: bash test/node/run-draw-stack.sh

      - name: Sanity-check dist/
        run: |
          test -f dist/index.html && test -f dist/racket-web.js && test -f dist/racket-web.wasm \
            || { echo "dist/ is missing the browser assets"; ls -la dist || true; exit 1; }

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error

  # Reuses the existing reusable workflow: it downloads the `dist` artifact and
  # runs the Playwright smoke suite (test/browser/) in headless Chromium.
  browser-tests:
    needs: build
    uses: ./.github/workflows/browser-tests.yml
    with:
      dist-artifact: dist

  # --- deploy -----------------------------------------------------------------
  # Publishes the same `dist` artifact to Netlify, gated behind a green build +
  # browser-tests. MANUAL ONLY: runs solely on a workflow_dispatch from main, so
  # pushes (and PRs) build+test but never deploy -- you trigger a release by
  # hand. COOP/COEP headers ship in dist/_headers + dist/netlify.toml (from
  # apps/ide/public/). Needs NETLIFY_AUTH_TOKEN + NETLIFY_SITE_ID repo secrets.
  deploy:
    needs: [build, browser-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with: { name: dist, path: dist }
      - name: Deploy to Netlify
        run: npx netlify-cli deploy --dir=dist --prod
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
