name: browser-tests

# Headless browser tests for the Racket WASM IDE surface (test/browser/).
#
# These need a built dist/ (scheme-web.* + ide.html + serve.rkt). Building the
# WASM image needs emsdk + a host Chez + a host Racket and is heavy, so the build
# is a SEPARATE concern: this workflow obtains a prebuilt dist/ and runs the
# tests against it. Wire the "obtain dist/" step to wherever you publish builds
# (an artifact from a build job, a release asset, or a cache).

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      dist-artifact:
        description: Name of an uploaded artifact containing dist/
        type: string
        default: dist

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- obtain dist/ -------------------------------------------------
      # Default: download an artifact named "dist" produced earlier in the same
      # run (e.g. by a build job that ran `racket build/main.rkt build` and
      # `actions/upload-artifact` of dist/). Replace with a release download or
      # cache restore if you publish builds differently.
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.dist-artifact || 'dist' }}
          path: dist
      - name: Sanity-check dist/
        run: |
          test -f dist/ide.html && test -f dist/scheme-web.js && test -f dist/serve.rkt \
            || { echo "dist/ is missing the browser assets"; ls -la dist || true; exit 1; }

      # --- toolchain ----------------------------------------------------
      - uses: Bogdanp/setup-racket@v1
        with:
          version: 'stable'        # only needs base libs to run serve.rkt
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps + Chromium
        working-directory: test/browser
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium

      - name: Run browser tests
        working-directory: test/browser
        run: npm test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: test/browser/playwright-report
          if-no-files-found: ignore
