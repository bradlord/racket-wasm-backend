<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Minimal fontconfig for the Racket WASM image. The image ships exactly
     one font (DejaVu Sans) under /share/fonts; this config points
     fontconfig at it and maps the generic families to it so racket/draw
     (Pango) always resolves a face. Without a config at all, fontconfig
     returns a NULL configuration, which left the browser worker hanging
     in font init (see build-wasm.md). Keep the dir list to the single
     shipped directory so the startup scan is trivial. -->
<fontconfig>
  <dir>/share/fonts</dir>
  <!-- Writable tmpfs location; see FONTCONFIG / HOME setenv in main_em.c. -->
  <cachedir>/tmp/fontconfig</cachedir>

  <!-- Resolve the generic families to the one face we ship. -->
  <alias><family>sans-serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias><family>serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias><family>Sans</family><prefer><family>DejaVu Sans</family></prefer></alias>

  <!-- Last-resort: anything unresolved still gets DejaVu Sans. -->
  <match target="pattern">
    <test name="family" qual="all" compare="not_eq"><string>DejaVu Sans</string></test>
    <edit name="family" mode="append_last" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
</fontconfig>
